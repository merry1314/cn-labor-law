name: 知识库一致性校验

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # 每月 1 日和 15 日 UTC 02:00 运行，监控动态数据时效性（工亡补助金等年度标准）
    - cron: '0 2 1,15 * *'

jobs:
  consistency-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 代码格式检查
        run: |
          gofmt -l consistency-check.go
          test -z "$(gofmt -l consistency-check.go)" || { echo "❌ consistency-check.go 未通过 gofmt 格式化"; exit 1; }

      - name: 静态分析
        run: go vet ./...

      - name: 运行一致性校验
        run: go run consistency-check.go
